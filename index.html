<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Form Patroli Security</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #1e3d59;
            --secondary-color: #17a2b8;
            --success-color: #28a745;
            --bg-color: #f4f6f9;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 15px; background-color: var(--bg-color); margin: 0; }
        .form-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 550px; margin: auto; }
        h2 { text-align: center; color: var(--primary-color); margin-top: 0; font-size: 22px; letter-spacing: 1px; }
        hr { border: 0; height: 2px; background: var(--primary-color); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        /* Gaya Tampilan Kotak Area Lapangan di Form Depan */
        .area-box { border: 1px solid #ddd; background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .area-title { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        /* Fitur Live Kamera */
        .camera-section { background: #f8f9fa; border: 1px dashed var(--secondary-color); padding: 10px; border-radius: 6px; text-align: center; margin-top: 5px; }
        .preview-foto { max-width: 100%; max-height: 150px; margin-top: 8px; display: none; border-radius: 4px; border: 1px solid #ccc; }
        
        /* Area Tanda Tangan Digital */
        .signature-pad { border: 1px solid #ccc; border-radius: 6px; background: #fff; width: 100%; height: 120px; touch-action: none; }
        
        /* Tombol-Tombol */
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-camera { background-color: var(--secondary-color); color: white; }
        .btn-pdf { background-color: var(--success-color); color: white; font-size: 16px; margin-top: 25px; box-shadow: 0 4px 6px rgba(40,167,69,0.2); }
        .btn-clear { background-color: #dc3545; color: white; padding: 6px; font-size: 12px; width: auto; margin: 5px 0 0 auto; }

        /* TAMPILAN KHUSUS SAAT DI-DOWNLOAD JADI PDF (BORDER KOTAK OTOMATIS) */
        .pdf-box-border { border: 2px solid #b0b0b0 !important; padding: 12px !important; margin-bottom: 15px !important; border-radius: 4px !important; background: #ffffff !important; }
        .pdf-hidden-row { display: none; font-weight: bold; color: #dc3545; background: #fff3cd; padding: 8px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="form-container" id="area-laporan-utama">
    <h2>FORM PATROLI SECURITY</h2>
    <hr>
    
    <div class="input-group">
        <label>Nama Petugas :</label>
        <input type="text" id="namaPetugas" placeholder="Masukkan nama lengkap">
    </div>

    <div class="input-group">
        <label>Shift Kerja :</label>
        <select id="shiftKerja">
            <option value="Shift Pagi (08:00 - 20:00)">Shift Pagi (08:00 - 20:00)</option>
            <option value="Shift Malam (20:00 - 08:00)">Shift Malam (20:00 - 08:00)</option>
        </select>
    </div>

    <div class="input-group">
        <label>Titik Lokasi Patroli Utama :</label>
        <select id="titikPatroli">
            <option value="Pos 1 - Gerbang Utama">Pos 1 - Gerbang Utama</option>
            <option value="Gedung Lobby & Perkantoran">Gedung Lobby & Perkantoran</option>
            <option value="Area Gudang & Logistik">Area Gudang & Logistik</option>
            <option value="Area Parkir & Lingkungan Belakang">Area Parkir & Lingkungan Belakang</option>
        </select>
    </div>

    <div class="pdf-hidden-row" id="row-gps-admin">
        📍 KOORDINAT GPS (ADMIN MONITOR): <span id="text-gps-koordinat">Mencari Sinyal...</span>
    </div>

    <hr style="background: #ccc; height: 1px;">

    <div class="area-box" class="target-pdf-box">
        <div class="area-title">AREA LOKASI 1</div>
        <div class="input-group">
            <label>Kondisi Situasi :</label>
            <select class="kondisi-area">
                <option value="Aman Terkendali">Aman Terkendali</option>
                <option value="Ada Temuan / Kejanggalan">Ada Temuan / Kejanggalan</option>
            </select>
        </div>
        <div class="input-group">
            <label>Catatan Detail Lapangan :</label>
            <textarea class="catatan-area" rows="2" placeholder="Tulis catatan jika ada temuan..."></textarea>
        </div>
        
        <div class="camera-section">
            <label style="font-weight:bold; font-size:12px; display:block; margin-bottom:5px;">📸 Foto Bukti Area 1 :</label>
            <input type="file" accept="image/*" capture="environment" class="input-kamera" onchange="previewKamera(this)">
            <img src="#" class="preview-foto" alt="Preview Foto Lapangan">
        </div>
    </div>

    <div class="input-group" style="margin-top: 20px;">
        <label>Tanda Tangan Petugas :</label>
        <canvas id="signatureCanvas" class="signature-pad"></canvas>
        <button type="button" class="btn-clear" onclick="hapusTandaTangan()">Hapus Tanda Tangan</button>
    </div>

    <button type="button" class="btn-pdf" onclick="prosesCetakLaporanPDF()">📄 DOWNLOAD LAPORAN PDF</button>
</div>

<script>
    // 1. LOGIKA UTAMA LIVE KAMERA HP
    function previewKamera(input) {
        const preview = input.nextElementSibling;
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 2. LOGIKA CANVAS TANDA TANGAN DIGITAL
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    // Menyesuaikan ukuran sensitivitas layar sentuh HP
    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Event melukis di HP (Touch) dan Laptop (Mouse)
    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', (e) => { drawing = true; handleTouch(e); });
    canvas.addEventListener('touchend', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', (e) => { if(drawing) handleTouch(e); });

    function draw(e) {
        if (!drawing) return;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
        
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function handleTouch(e) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    }

    function hapusTandaTangan() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 3. FUNGSI AMBIL GPS SECARA RAHSIA & DOWNLOAD PDF (VERSI AMAN FIX)
    function prosesCetakLaporanPDF() {
        // Validasi Nama Wajib Diisi
        const nama = document.getElementById("namaPetugas").value;
        if (!nama) {
            alert("⚠️ Nama Petugas tidak boleh kosong!");
            return;
        }

        const gpsRow = document.getElementById("row-gps-admin");
        const gpsText = document.getElementById("text-gps-koordinat");
        
        // Munculkan baris GPS admin sesaat sebelum dicetak ke PDF
        gpsRow.style.display = "block";
        gpsText.innerText = "Mengunci Koordinat...";

        // Mulai ambil GPS Tersembunyi
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Sukses ambil GPS secara senyap
                    gpsText.innerText = position.coords.latitude + ", " + position.coords.longitude;
                    eksekusiDownloadPDF();
                },
                function(error) {
                    // Gagal ambil GPS karena izin diblokir petugas
                    gpsText.innerText = "GPS Mati / Izin Akses Browser Ditolak Petugas";
                    eksekusiDownloadPDF();
                },
                { enableHighAccuracy: true, timeout: 4000 }
            );
        } else {
            gpsText.innerText = "HP Tidak Mendukung Fitur GPS";
            eksekusiDownloadPDF();
        }
    }

    function eksekusiDownloadPDF() {
        const element = document.getElementById('area-laporan-utama');
        
        // Sembunyikan semua tombol dan input file kamera agar file PDF rapi dan bersih
        const tombols = element.querySelectorAll('button');
        const inputsKamera = element.querySelectorAll('.input-kamera');
        tombols.forEach(btn => btn.style.display = 'none');
        inputsKamera.forEach(inp => inp.style.display = 'none');

        // AKTIFKAN BORDER KOTAK AREA PADA PDF
        const areaBoxes = element.querySelectorAll('.area-box');
        areaBoxes.forEach(box => box.classList.add('pdf-box-border'));

        // Aturan Cetak PDF A4
        const opsi = {
            margin:       10,
            filename:     'Laporan_Patroli_' + document.getElementById("namaPetugas").value.replace(/\s+/g, '_') + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Mulai Proses Download Otomatis
        html2pdf().set(opsi).from(element).save().then(() => {
            // Setelah berhasil di-download, kembalikan tampilan layar HP seperti semula
            tombols.forEach(btn => btn.style.display = 'flex');
            element.querySelector('.btn-clear').style.display = 'block';
            inputsKamera.forEach(inp => inp.style.display = 'block');
            areaBoxes.forEach(box => box.classList.remove('pdf-box-border'));
            document.getElementById("row-gps-admin").style.display = "none"; // Sembunyikan lagi baris GPS dari mata petugas
        });
    }
</script>

</body>
</html>
